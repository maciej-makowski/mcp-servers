[project]
name = "outlook-mcp-server"
version = "0.1.0"
description = "FastMCP stdio server for Microsoft Graph (mail, calendar, To-Do, OneDrive)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2,<2",
    "requests>=2.31,<3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
