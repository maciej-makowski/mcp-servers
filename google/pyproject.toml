[project]
name = "google-mcp-server"
version = "0.1.0"
description = "FastMCP stdio server wrapping the google-workspace skill script"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2,<2",
    "google-api-python-client>=2.100,<3",
    "google-auth>=2.23,<3",
    "google-auth-oauthlib>=1.1,<2",
    "mcp-auth",
]

[tool.uv.sources]
mcp-auth = { path = "../_shared/mcp_auth", editable = true }

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
