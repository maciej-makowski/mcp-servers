name: images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

# Security note: the only ${{ }} interpolation in run: blocks is
# steps.build.outputs.digest (build-controlled, not attacker input).
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: google
            dir: google
          - name: outlook
            dir: outlook
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run tests
        run: uv run pytest
        working-directory: ${{ matrix.dir }}

  changes:
    runs-on: ubuntu-latest
    outputs:
      google: ${{ steps.filter.outputs.google }}
      outlook: ${{ steps.filter.outputs.outlook }}
      notion: ${{ steps.filter.outputs.notion }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            google:
              - 'google/**'
              - '_shared/**'
              - 'Containerfile.google'
              - '.github/workflows/images.yml'
            outlook:
              - 'outlook/**'
              - '_shared/**'
              - 'Containerfile.outlook'
              - '.github/workflows/images.yml'
            notion:
              - 'Containerfile.notion'
              - '.github/workflows/images.yml'

  build:
    needs: [tests, changes]
    # tests may skip nothing (always runs), changes gates per-target.
    if: ${{ always() && needs.changes.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: google
            dockerfile: Containerfile.google
            context: .
          - name: outlook
            dockerfile: Containerfile.outlook
            context: .
          - name: notion
            dockerfile: Containerfile.notion
            context: .
    steps:
      - name: Skip if no relevant changes
        id: skip
        if: needs.changes.outputs[matrix.name] != 'true'
        run: echo "SKIP=1" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        if: env.SKIP != '1'

      - name: Set up QEMU (arm64)
        if: env.SKIP != '1'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: env.SKIP != '1'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.SKIP != '1'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: env.SKIP != '1'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/maciej-makowski/mcp-${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/maciej-makowski/mcp-${{ matrix.name }}:sha-${{ github.sha }}
          outputs: type=image,compression=zstd

      - name: Image digest
        if: env.SKIP != '1' && steps.build.outputs.digest
        run: echo "digest=${{ steps.build.outputs.digest }}"
