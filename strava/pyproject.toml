[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strava-mcp"
version = "0.1.0"
description = "MCP server for the Strava v3 API: athlete, activities, rate status (read-only)"
requires-python = ">=3.11"
dependencies = [
    "mcp",
    "mcp-auth",
    "httpx",
]

[tool.uv.sources]
mcp-auth = { path = "../_shared/mcp_auth", editable = true }

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
strava-mcp = "strava_mcp.server:main"

[tool.setuptools.packages.find]
include = ["strava_mcp*"]
